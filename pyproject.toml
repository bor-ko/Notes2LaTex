[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notes2tex"
version = "0.1.0"
description = "Convert handwritten tablet notes into structured LaTeX"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["torch>=2.5", "torchvision>=0.20"]

[project.scripts]
notes2tex = "notes2tex.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests"]
